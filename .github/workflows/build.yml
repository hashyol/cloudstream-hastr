name: Cloudstream Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Prepare Builds Branch
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/builds/.git" ]; then
            echo "Creating builds branch..."
            mkdir -p $GITHUB_WORKSPACE/builds
            cd $GITHUB_WORKSPACE/builds
            git init
            git checkout -b builds
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi
          rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon || (sleep 10 && ./gradlew make makePluginsJson --no-daemon)
          cp -f **/build/*.cs3 $GITHUB_WORKSPACE/builds/
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/

      - name: Push Builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git checkout -B builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Derleme: $GITHUB_SHA" || exit 0
          git push --force origin builds
